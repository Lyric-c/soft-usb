name: Test

on:
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Linux amd64 — 原生运行
  # ═══════════════════════════════════════════════════════════════════
  test-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build libViKey.so
        run: CGO_ENABLED=1 go build -buildmode=c-shared -o libViKey.so .

      - name: Test (run 100×, verify HID stable)
        run: |
          cat > /tmp/test.c << 'EOF'
          #include <stdio.h>
          #include <stdint.h>
          extern uint32_t VikeyFind(uint32_t *pdwCount);
          extern uint32_t VikeyGetHID(uint16_t index, uint32_t *pdwHID);
          int main() {
              uint32_t n=0, hid=0, r;
              r=VikeyFind(&n);
              if(r!=0||n!=1){printf("FAIL VikeyFind r=%u n=%u\n",r,n);return 1;}
              r=VikeyGetHID(0,&hid);
              if(r!=0){printf("FAIL VikeyGetHID #1 r=%u\n",r);return 1;}
              uint32_t first=hid;
              for(int i=2;i<=100;i++){
                  r=VikeyGetHID(0,&hid);
                  if(r!=0){printf("FAIL VikeyGetHID #%d r=%u\n",i,r);return 1;}
                  if(hid!=first){printf("FAIL HID mismatch #%d: %u != %u\n",i,hid,first);return 1;}
              }
              printf("PASS 100 calls HID=%u\n",first);
              return 0;
          }
          EOF
          gcc -o /tmp/test /tmp/test.c -L. -lViKey -Wl,-rpath,.
          /tmp/test

      - name: Test in Docker (mount host per README, 100×)
        run: |
          cat > /tmp/Dockerfile << 'DEOF'
          FROM debian:bookworm-slim
          WORKDIR /app
          COPY libViKey.so test ./
          CMD ["./test"]
          DEOF

          # 编译容器内用的测试程序（rpath 指向 /app）
          gcc -o /tmp/test_docker /tmp/test.c -L. -lViKey -Wl,-rpath,/app
          cp libViKey.so /tmp/
          mv /tmp/test_docker /tmp/test

          # 构建可复现的小镜像，跳过网络安装包以减少不稳定性
          docker build -t soft-usb-test -f /tmp/Dockerfile /tmp

          # 按 README 收集挂载参数（源路径不存在则跳过）
          MOUNTS=""
          [ -f /etc/machine-id ]    && MOUNTS="$MOUNTS -v /etc/machine-id:/etc/machine-id:ro"
          [ -d /sys/class/dmi/id ]  && MOUNTS="$MOUNTS -v /sys/class/dmi/id:/sys/class/dmi/id:ro"
          [ -d /sys/block ]         && MOUNTS="$MOUNTS -v /sys/block:/sys/block:ro"

          echo "Mounts: ${MOUNTS:-none}"
          docker run --rm $MOUNTS soft-usb-test

      - uses: actions/upload-artifact@v4
        with:
          name: libViKey-linux-amd64
          path: libViKey.so

  # ═══════════════════════════════════════════════════════════════════
  # Linux arm64 — QEMU user mode
  # ═══════════════════════════════════════════════════════════════════
  test-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static

      - name: Build libViKey.so
        env:
          GOOS: linux
          GOARCH: arm64
          CC: aarch64-linux-gnu-gcc
          CGO_ENABLED: 1
        run: go build -buildmode=c-shared -o libViKey.so .

      - name: Test (QEMU — 100× HID stability)
        run: |
          cat > /tmp/test.c << 'EOF'
          #include <stdio.h>
          #include <stdint.h>
          extern uint32_t VikeyFind(uint32_t *pdwCount);
          extern uint32_t VikeyGetHID(uint16_t index, uint32_t *pdwHID);
          int main() {
              uint32_t n=0, hid=0, r;
              r=VikeyFind(&n);
              if(r!=0||n!=1){printf("FAIL VikeyFind r=%u n=%u\n",r,n);return 1;}
              r=VikeyGetHID(0,&hid);
              if(r!=0){printf("FAIL VikeyGetHID #1 r=%u\n",r);return 1;}
              uint32_t first=hid;
              for(int i=2;i<=100;i++){
                  r=VikeyGetHID(0,&hid);
                  if(r!=0){printf("FAIL VikeyGetHID #%d r=%u\n",i,r);return 1;}
                  if(hid!=first){printf("FAIL HID mismatch #%d: %u != %u\n",i,hid,first);return 1;}
              }
              printf("PASS 100 calls HID=%u\n",first);
              return 0;
          }
          EOF
          cp libViKey.so /tmp/
          aarch64-linux-gnu-gcc -o /tmp/test /tmp/test.c -L/tmp -lViKey -Wl,-rpath,/tmp
          qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/test

      - uses: actions/upload-artifact@v4
        with:
          name: libViKey-linux-arm64
          path: libViKey.so

  # ═══════════════════════════════════════════════════════════════════
  # Linux loong64 loong1 (旧版 ABI — loongnix Go 1.25.8 + GCC 8.3.0)
  # ═══════════════════════════════════════════════════════════════════
  test-linux-loong1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Download LoongArch64 GCC 8.3.0 Cross Toolchain
        run: |
          mkdir -p /tmp/loong-gcc8
          curl -fsSL https://ftp.loongnix.cn/toolchain/gcc/release/loongarch/gcc8/loongson-gnu-toolchain-8.3-x86_64-loongarch64-linux-gnu-rc1.6.tar.xz \
            | tar -Jxv -C /tmp/loong-gcc8 --strip-components=1

      - name: Download LoongArch64 Go 1.25.8 (abi1.0)
        run: |
          mkdir -p /tmp/loong-go
          curl -fsSL https://ftp.loongnix.cn/toolchain/golang/go-1.25/abi1.0/go1.25.8.linux-amd64.tar.gz \
            | tar -zxv -C /tmp/loong-go --strip-components=1

      - name: Build libViKey.so
        env:
          GOOS: linux
          GOARCH: loong64
          PATH: /tmp/loong-go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          CGO_ENABLED: 1
        run: |
          CC=$(find /tmp/loong-gcc8 -name '*-gcc' -type f | head -1)
          CXX=$(find /tmp/loong-gcc8 -name '*-g++' -type f | head -1)
          echo "CC=${CC}" && echo "CXX=${CXX}"
          export CC CXX
          go build -buildmode=c-shared -o libViKey.so .

      - name: Test (QEMU — 100× HID stability, or symbol check)
        run: |
          CC=$(find /tmp/loong-gcc8 -name '*-gcc' -type f | head -1)
          SYSROOT=$($CC --print-sysroot)
          echo "CC=${CC}  SYSROOT=${SYSROOT}"

          cat > /tmp/test.c << 'EOF'
          #include <stdio.h>
          #include <stdint.h>
          extern uint32_t VikeyFind(uint32_t *pdwCount);
          extern uint32_t VikeyGetHID(uint16_t index, uint32_t *pdwHID);
          int main() {
              uint32_t n=0, hid=0, r;
              r=VikeyFind(&n);
              if(r!=0||n!=1){printf("FAIL VikeyFind r=%u n=%u\n",r,n);return 1;}
              r=VikeyGetHID(0,&hid);
              if(r!=0){printf("FAIL VikeyGetHID #1 r=%u\n",r);return 1;}
              uint32_t first=hid;
              for(int i=2;i<=100;i++){
                  r=VikeyGetHID(0,&hid);
                  if(r!=0){printf("FAIL VikeyGetHID #%d r=%u\n",i,r);return 1;}
                  if(hid!=first){printf("FAIL HID mismatch #%d: %u != %u\n",i,hid,first);return 1;}
              }
              printf("PASS 100 calls HID=%u\n",first);
              return 0;
          }
          EOF
          cp libViKey.so /tmp/
          $CC -o /tmp/test /tmp/test.c -L/tmp -lViKey -Wl,-rpath,/tmp

          QBIN=$(command -v qemu-loongarch64-static 2>/dev/null || command -v qemu-loongarch64 2>/dev/null || true)
          if [ -n "$QBIN" ]; then
            echo "Running with ${QBIN} ..."
            $QBIN -L "$SYSROOT" /tmp/test || {
              RC=$?
              echo "QEMU exited with ${RC}, fallback to symbol check"
              readelf -Ws libViKey.so | grep -E 'VikeyFind|VikeyGetHID|GetMachineId'
            }
          else
            echo "SKIP runtime: qemu-loongarch64 not available — checking symbols instead"
            readelf -Ws libViKey.so | grep -E 'VikeyFind|VikeyGetHID|GetMachineId'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: libViKey-linux-loong64-loong1
          path: libViKey.so

  # ═══════════════════════════════════════════════════════════════════
  # Linux loong64 loong2 (新版 — 标准 Go + 社区 GCC 15.1.0)
  # ═══════════════════════════════════════════════════════════════════
  test-linux-loong2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Download LoongArch64 GCC 15.1.0 Cross Toolchain
        run: |
          mkdir -p /tmp/loong-gcc15
          curl -fsSL https://github.com/loongson/build-tools/releases/download/2025.08.08/x86_64-cross-tools-loongarch64-binutils_2.45-gcc_15.1.0-glibc_2.42.tar.xz \
            | tar -Jxv -C /tmp/loong-gcc15 --strip-components=1

      - name: Build libViKey.so
        env:
          GOOS: linux
          GOARCH: loong64
          CGO_ENABLED: 1
        run: |
          CC=$(find /tmp/loong-gcc15 -name '*-gcc' -type f | head -1)
          CXX=$(find /tmp/loong-gcc15 -name '*-g++' -type f | head -1)
          echo "CC=${CC}" && echo "CXX=${CXX}"
          export CC CXX
          go build -buildmode=c-shared -o libViKey.so .

      - name: Test (QEMU — 100× HID stability, or symbol check)
        run: |
          CC=$(find /tmp/loong-gcc15 -name '*-gcc' -type f | head -1)
          SYSROOT=$($CC --print-sysroot)
          echo "CC=${CC}  SYSROOT=${SYSROOT}"

          cat > /tmp/test.c << 'EOF'
          #include <stdio.h>
          #include <stdint.h>
          extern uint32_t VikeyFind(uint32_t *pdwCount);
          extern uint32_t VikeyGetHID(uint16_t index, uint32_t *pdwHID);
          int main() {
              uint32_t n=0, hid=0, r;
              r=VikeyFind(&n);
              if(r!=0||n!=1){printf("FAIL VikeyFind r=%u n=%u\n",r,n);return 1;}
              r=VikeyGetHID(0,&hid);
              if(r!=0){printf("FAIL VikeyGetHID #1 r=%u\n",r);return 1;}
              uint32_t first=hid;
              for(int i=2;i<=100;i++){
                  r=VikeyGetHID(0,&hid);
                  if(r!=0){printf("FAIL VikeyGetHID #%d r=%u\n",i,r);return 1;}
                  if(hid!=first){printf("FAIL HID mismatch #%d: %u != %u\n",i,hid,first);return 1;}
              }
              printf("PASS 100 calls HID=%u\n",first);
              return 0;
          }
          EOF
          cp libViKey.so /tmp/
          $CC -o /tmp/test /tmp/test.c -L/tmp -lViKey -Wl,-rpath,/tmp

          QBIN=$(command -v qemu-loongarch64-static 2>/dev/null || command -v qemu-loongarch64 2>/dev/null || true)
          if [ -n "$QBIN" ]; then
            echo "Running with ${QBIN} ..."
            $QBIN -L "$SYSROOT" /tmp/test || {
              RC=$?
              echo "QEMU exited with ${RC}, fallback to symbol check"
              readelf -Ws libViKey.so | grep -E 'VikeyFind|VikeyGetHID|GetMachineId'
            }
          else
            echo "SKIP runtime: qemu-loongarch64 not available — checking symbols instead"
            readelf -Ws libViKey.so | grep -E 'VikeyFind|VikeyGetHID|GetMachineId'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: libViKey-linux-loong64-loong2
          path: libViKey.so

  # ═══════════════════════════════════════════════════════════════════
  # Windows amd64 — Wine（尝试）+ 符号检查
  # ═══════════════════════════════════════════════════════════════════
  test-windows-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine64 || true

      - name: Build ViKey.dll
        env:
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
          CGO_ENABLED: 1
        run: go build -buildmode=c-shared -o ViKey.dll .

      - name: Test (Wine — 100× HID stability, or symbol check)
        run: |
          cat > /tmp/test.c << 'EOF'
          #include <stdio.h>
          #include <stdint.h>
          extern uint32_t VikeyFind(uint32_t *pdwCount);
          extern uint32_t VikeyGetHID(uint16_t index, uint32_t *pdwHID);
          int main() {
              uint32_t n=0, hid=0, r;
              r=VikeyFind(&n);
              if(r!=0||n!=1){printf("FAIL VikeyFind r=%u n=%u\n",r,n);return 1;}
              r=VikeyGetHID(0,&hid);
              if(r!=0){printf("FAIL VikeyGetHID #1 r=%u\n",r);return 1;}
              uint32_t first=hid;
              for(int i=2;i<=100;i++){
                  r=VikeyGetHID(0,&hid);
                  if(r!=0){printf("FAIL VikeyGetHID #%d r=%u\n",i,r);return 1;}
                  if(hid!=first){printf("FAIL HID mismatch #%d: %u != %u\n",i,hid,first);return 1;}
              }
              printf("PASS 100 calls HID=%u\n",first);
              return 0;
          }
          EOF
          cp ViKey.dll /tmp/
          x86_64-w64-mingw32-gcc -o /tmp/test.exe /tmp/test.c -L/tmp -lViKey

          if command -v wine &>/dev/null; then
            echo "Running with wine ..."
            export WINEDEBUG=-all
            (cd /tmp && wine test.exe) || {
              RC=$?
              echo "Wine exited with ${RC}, fallback to symbol check"
              x86_64-w64-mingw32-objdump -p ViKey.dll | grep -A20 '\[Export'
            }
          else
            echo "SKIP runtime: wine not available — checking symbols instead"
            x86_64-w64-mingw32-objdump -p ViKey.dll | grep -A20 '\[Export'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ViKey-windows-amd64
          path: ViKey.dll
